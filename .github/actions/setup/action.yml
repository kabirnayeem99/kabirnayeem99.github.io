name: Set up checks
description: Node, npm packages and Chromium for `npm run verify`; optionally uv, ShellCheck and shfmt.

inputs:
  tools:
    description: Also install what the --python and --shell groups need.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: "astro/package-lock.json"

    - name: Setup uv
      if: inputs.tools == 'true'
      uses: astral-sh/setup-uv@v9.0.0

    # Pinned, so a new release cannot change what passes.
    - name: Install ShellCheck and shfmt
      if: inputs.tools == 'true'
      shell: bash
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHFMT_VERSION: v3.13.1
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/bin"
        mkdir -p "$bin"
        curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" |
          tar -xJ -C "$bin" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
        curl -fsSL -o "$bin/shfmt" "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
        chmod +x "$bin/shfmt"
        echo "$bin" >>"$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      working-directory: astro
      run: npm ci

    - name: Cache Chromium
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('astro/package-lock.json') }}

    # The headless shell is all the checks launch.
    - name: Install Chromium
      shell: bash
      working-directory: astro
      run: npx --no-install playwright install --with-deps --only-shell chromium
