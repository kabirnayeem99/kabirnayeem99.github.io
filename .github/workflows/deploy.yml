name: Deploy Astro to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up checks
        uses: ./.github/actions/setup

      # Every check, on the committed data. Nothing is deployed unless this passes.
      - name: Verify
        run: npm run verify

      # Fresh figures for the stats page's bundled snapshot. A source that cannot be
      # fetched keeps the committed figures, and nothing here may stop the deploy.
      - name: Refresh stats snapshot
        continue-on-error: true
        timeout-minutes: 4
        run: npm run stats:refresh

      # Fresh figures that break the build or a page are dropped, not deployed.
      - name: Build with fresh figures
        run: |
          if ! { npm run build && npm run test:smoke; }; then
            echo "::warning::fresh stats broke the site; deploying the committed figures"
            git checkout -- src/data/stats-snapshots.json
            npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages looks the artifact up once and does not retry; GitHub's
      # artifact listing can lag the upload by a moment. Retry once after a pause.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Expose page URL
        id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}" >> "$GITHUB_OUTPUT"
