name: Deploy Astro to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: astro
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "astro/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: |
          npm run lint
          npm run check
          npm run test
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages looks the artifact up once and does not retry; GitHub's
      # artifact listing can lag the upload by a moment. Retry once after a pause.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Expose page URL
        id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}" >> "$GITHUB_OUTPUT"
