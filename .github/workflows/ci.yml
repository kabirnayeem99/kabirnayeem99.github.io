name: Astro CI

on:
  pull_request:
    paths:
      - "astro/**"
      - "scripts/**"
      - ".githooks/**"
      - ".shellcheckrc"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main"]
    paths:
      - "astro/**"
      - "scripts/**"
      - ".githooks/**"
      - ".shellcheckrc"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up checks
        uses: ./.github/actions/setup

      - name: Verify
        working-directory: astro
        run: npm run verify
