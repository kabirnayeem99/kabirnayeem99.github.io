name: Astro CI

# Pull requests only: a push to main is verified by the deploy workflow, once.
on:
  pull_request:
    paths:
      - "astro/**"
      - "scripts/**"
      - ".githooks/**"
      - ".shellcheckrc"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up checks
        uses: ./.github/actions/setup
        with:
          tools: "true"

      - name: Verify
        working-directory: astro
        run: npm run verify
